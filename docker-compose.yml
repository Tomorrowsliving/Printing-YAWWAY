services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: klipper_farm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d klipper_farm"]
      interval: 5s
      timeout: 5s
      retries: 5

  nfs:
    image: itsthenetwork/nfs-server-alpine:latest
    container_name: klipper-farm-nfs
    privileged: true
    environment:
      SHARED_DIRECTORY: /exports
    volumes:
      - ./storage:/exports
    ports:
      - "2049:2049"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db/klipper_farm
      PRINTERS_PATH: /app/storage/printers
      BACKUP_PATH: /app/storage/backups
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
