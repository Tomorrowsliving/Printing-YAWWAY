services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: klipper_farm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d klipper_farm"]
      interval: 5s
      timeout: 5s
      retries: 5

  storage-init:
    image: alpine:latest
    container_name: klipper-farm-storage-init
    command: >
      sh -c "
      mkdir -p /storage/printers /storage/gcodes /storage/configs /storage/backups /storage/uploads /storage/logs &&
      chmod -R 777 /storage &&
      echo 'Storage initialised'
      "
    volumes:
      - ./storage:/storage
    restart: "no"

  nfs:
    image: itsthenetwork/nfs-server-alpine:latest
    container_name: klipper-farm-nfs
    privileged: true
    network_mode: host
    restart: unless-stopped
    depends_on:
      - storage-init
    environment:
      SHARED_DIRECTORY: /exports
      PERMITTED: "${NFS_PERMITTED:-*}"
      SYNC: "${NFS_SYNC:-true}"
    volumes:
      - ./storage:/exports

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db/klipper_farm
      STORAGE_ROOT: /mnt/klipper-farm
      PRINTERS_PATH: /mnt/klipper-farm/printers
      BACKUP_PATH: /mnt/klipper-farm/backups
      NFS_SERVER_HOST: "${NFS_SERVER_HOST:-}"
      NFS_EXPORT_PATH: "${NFS_EXPORT_PATH:-/exports}"
      NFS_CLIENT_MOUNT: "${NFS_CLIENT_MOUNT:-/mnt/klipper-farm}"
      NFS_PERMITTED: "${NFS_PERMITTED:-*}"
      NFS_SYNC: "${NFS_SYNC:-true}"
      AGENT_PORT: "${AGENT_PORT:-8001}"
      BACKEND_PUBLIC_URL: "${BACKEND_PUBLIC_URL:-http://localhost}"
    volumes:
      - ./storage:/mnt/klipper-farm
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
