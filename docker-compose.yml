services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: klipper_farm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d klipper_farm"]
      interval: 5s
      timeout: 5s
      retries: 5

  nfs:
    image: itsthenetwork/nfs-server-alpine:latest
    container_name: klipper-farm-nfs
    privileged: true
    network_mode: host
    restart: unless-stopped
    environment:
      SHARED_DIRECTORY: /exports
      PERMITTED: ${NFS_PERMITTED:-10.1.8.0/22}
      READ_ONLY: "false"
      SYNC: "true"
    volumes:
      - ./storage:/exports

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@db/klipper_farm
      PRINTERS_PATH: /mnt/klipper-farm/printers
      BACKUP_PATH: /mnt/klipper-farm/backups
    volumes:
      - ./storage:/mnt/klipper-farm
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
